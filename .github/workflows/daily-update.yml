name: Market & News Data Pipeline

# ─── SCHEDULING PHILOSOPHY ────────────────────────────────────────────────────
#
# GitHub Actions cron runs in UTC. Eastern Time observes DST:
#   EST (Nov → Mar): UTC-5     EDT (Mar → Nov): UTC-4
#
#   Slot 1  13:30 UTC  =  8:30 AM EST  /  9:30 AM EDT  (at market open)
#   Slot 2  17:00 UTC  = 12:00 PM EST  /  1:00 PM EDT  (midday)
#   Slot 3  20:45 UTC  =  3:45 PM EST  /  4:45 PM EDT  (near/post close)
#   Master  22:00 UTC  =  5:00 PM EST  /  6:00 PM EDT  (well after close)
#
# WHY SEPARATE JOBS: GitHub Actions delays of 15-90 mins used to make the old
# single-job design run news instead of master. Separate jobs with separate
# schedule triggers eliminate this.
#
# ONE RUN AT A TIME: every job reads and rewrites the shared Redis "portfolio"
# object. The concurrency group below makes runs queue instead of overlapping,
# so a news run can never overwrite the master run's scores (or the reverse).
#
# TWO LAYERS OF CHECKS
#   DAILY   eod-master  → quality / alpha-compounder score, regime and signals (daily-update.js)
#   PERIODIC multibagger → thesis check: every portfolio stock is re-checked every 15 days
#           (or sooner on a trigger: new filing/earnings analysis, critical 8-K, old-engine sell signal).
#           It runs as the LAST step of the nightly master job and only does the stocks that are due.
#
# MANUAL RUNS (Actions tab, or the Screener tab's "Run" button, which dispatches these):
#   master    full EOD run
#   news      intraday news run
#   matrix    correlation matrix only
#   screen    re-check EVERYTHING now (portfolio + watchlist), ignores the 15-day cadence
#   watchlist screen only pending/stale watchlist stocks (what the Screener "Run" button uses)
# workflow_dispatch sets FORCE_RUN=true for master/news/screen so the scripts skip the market-closed gate.

on:
  schedule:
    - cron: '30 13 * * 1-5'  # Slot 1:  8:30 AM EST /  9:30 AM EDT → intraday-news
    - cron: '0 17 * * 1-5'   # Slot 2: 12:00 PM EST /  1:00 PM EDT → intraday-news
    - cron: '45 20 * * 1-5'  # Slot 3:  3:45 PM EST /  4:45 PM EDT → intraday-news
    - cron: '0 22 * * 1-5'   # Master:  5:00 PM EST /  6:00 PM EDT → eod-master

  workflow_dispatch:
    inputs:
      run_type:
        description: 'Which engine to run manually?'
        required: true
        default: 'master'
        type: choice
        options:
          - master
          - news
          - matrix
          - screen
          - watchlist

permissions:
  contents: write

concurrency:
  group: portfolio-pipeline
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 1: EOD MASTER (+ matrix, earnings, filing narrative, periodic thesis check)
  # ════════════════════════════════════════════════════════════════════════════
  eod-master:
    name: EOD Master + Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 22 * * 1-5') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_type == 'master')

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Run master update
        working-directory: backend
        env:
          REDIS_URL:            ${{ secrets.REDIS_URL }}
          FINNHUB_API_KEY:      ${{ secrets.FINNHUB_API_KEY }}
          NEWSDATA_API_KEY:     ${{ secrets.NEWSDATA_API_KEY }}
          FMP_API_KEY:          ${{ secrets.FMP_API_KEY }}
          POLYGON_API_KEY:      ${{ secrets.POLYGON_API_KEY }}
          SEC_API_KEY:          ${{ secrets.SEC_API_KEY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          # FORCE_RUN=true on manual dispatch → skips market-closed gate in daily-update.js
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: npm run update

      - name: Run correlation matrix
        working-directory: backend
        env:
          REDIS_URL:            ${{ secrets.REDIS_URL }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: npm run generate-correlation

      - name: Run Earnings Event Analyser
        working-directory: backend
        env:
          REDIS_URL:            ${{ secrets.REDIS_URL }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FINNHUB_API_KEY:      ${{ secrets.FINNHUB_API_KEY }}
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
        run: npm run earnings-event || true

      - name: Run Filing Narrative Analyser
        working-directory: backend
        env:
          REDIS_URL:            ${{ secrets.REDIS_URL }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
        run: npm run filing-narrative || true

      # Periodic multibagger thesis check. Runs AFTER the quality engine, filing and earnings analyses so it always
      # reads today's quality score and analyses. Only portfolio stocks that are due (15 days, or triggered) are
      # re-checked, plus pending/stale watchlist stocks. Never fails the pipeline.
      - name: Run Compounder Thesis Check
        working-directory: backend
        env:
          REDIS_URL:             ${{ secrets.REDIS_URL }}
          FINNHUB_API_KEY:       ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY:           ${{ secrets.FMP_API_KEY }}
          POLYGON_API_KEY:       ${{ secrets.POLYGON_API_KEY }}
          WATCHLIST_MAX_PER_RUN: '60'
          MB_REFRESH_DAYS:       '15'
        run: npm run multibagger || true

      - name: Configure git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Commit score history CSV
        run: |
          git add backend/data/score_history.csv || true
          git commit -m "📊 EOD $(date -u +%Y-%m-%d)" || true
          git pull --rebase origin main || true
          git push || true

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 2: INTRADAY NEWS — 3 slots per day
  # ════════════════════════════════════════════════════════════════════════════
  intraday-news:
    name: Intraday News Update
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'schedule' && (
        github.event.schedule == '30 13 * * 1-5' ||
        github.event.schedule == '0 17 * * 1-5'  ||
        github.event.schedule == '45 20 * * 1-5'
      )) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_type == 'news')

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Run intraday news update
        working-directory: backend
        env:
          REDIS_URL:            ${{ secrets.REDIS_URL }}
          NEWSDATA_API_KEY:     ${{ secrets.NEWSDATA_API_KEY }}
          FINNHUB_API_KEY:      ${{ secrets.FINNHUB_API_KEY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: npm run update:news

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 3: MATRIX ONLY (manual) — recalculate correlations after adding/removing stocks
  # ════════════════════════════════════════════════════════════════════════════
  correlation-matrix:
    name: Correlation Matrix Only
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' && github.event.inputs.run_type == 'matrix'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Run correlation matrix
        working-directory: backend
        env:
          REDIS_URL:            ${{ secrets.REDIS_URL }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: npm run generate-correlation

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 4: COMPOUNDER SCREEN (manual). Started from the Actions tab or the Screener tab's "Run" button.
  #   run_type = screen    → re-check EVERYTHING now (portfolio + watchlist), ignoring the 15-day cadence
  #   run_type = watchlist → only pending/stale watchlist stocks; the stored portfolio results are left untouched
  # ════════════════════════════════════════════════════════════════════════════
  multibagger-screen:
    name: Compounder Screen (manual)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.run_type == 'screen' || github.event.inputs.run_type == 'watchlist')

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Run compounder screen
        working-directory: backend
        env:
          REDIS_URL:             ${{ secrets.REDIS_URL }}
          FINNHUB_API_KEY:       ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY:           ${{ secrets.FMP_API_KEY }}
          POLYGON_API_KEY:       ${{ secrets.POLYGON_API_KEY }}
          WATCHLIST_MAX_PER_RUN: '60'
          MB_REFRESH_DAYS:       '15'
          FORCE_RUN: ${{ github.event.inputs.run_type == 'screen' && 'true' || 'false' }}
        run: npm run multibagger -- ${{ github.event.inputs.run_type == 'watchlist' && '--watchlist-only' || '' }}

# ─── SCHEDULE SUMMARY ─────────────────────────────────────────────────────────
# 30 13 * * 1-5  → intraday-news slot 1     0 17 * * 1-5 → intraday-news slot 2
# 45 20 * * 1-5  → intraday-news slot 3     0 22 * * 1-5 → eod-master (… → periodic thesis check)
