name: Market & News Data Pipeline

# ─── SCHEDULING ───────────────────────────────────────────────────────────────
# GitHub Actions cron runs in UTC. EST = UTC-5 (Nov-Mar), EDT = UTC-4 (Mar-Nov).
#   Slot 1  13:30 UTC = 8:30 AM EST / 9:30 AM EDT   intraday news
#   Slot 2  17:00 UTC = 12:00 PM EST / 1:00 PM EDT  intraday news
#   Slot 3  20:45 UTC = 3:45 PM EST / 4:45 PM EDT   intraday news
#   Master  22:00 UTC = 5:00 PM EST / 6:00 PM EDT   EOD run
#
# ONE RUN AT A TIME: every job rewrites the shared Redis "portfolio" object, so runs queue (concurrency group).
#
# EOD ORDER (changed): earnings-event FIRST so the daily engine reads today's earnings numbers, not yesterday's.
#   1 earnings-event  2 daily-update  3 correlation  4 filing-narrative  5 multibagger thesis check  6 pipeline report
#
# FAILURES ARE VISIBLE (changed): the optional steps no longer end in "|| true". Each one has continue-on-error so a
# failure does not stop the others, but the last step reads every outcome, writes a table to the job summary,
# raises a warning annotation per failed step, and turns the job RED if any step failed. daily-update.js is the core
# step: if it fails the job stops there, as before.
#
# MANUAL RUNS (Actions tab or the Screener "Run" button): master | news | matrix | screen | watchlist | diagnose | redis-check
#   redis-check = is Redis reachable and storing data? (no terminal needed; prints counts only, never keys or tickers)
# workflow_dispatch sets FORCE_RUN=true so scripts skip the market-closed gate.

on:
  schedule:
    - cron: '30 13 * * 1-5'
    - cron: '0 17 * * 1-5'
    - cron: '45 20 * * 1-5'
    - cron: '0 22 * * 1-5'
    - cron: '0 12 * * 0'    # Sunday 12:00 UTC: Redis keepalive + portfolio backup (also counts as activity for Redis Cloud's free-tier inactivity rule)

  workflow_dispatch:
    inputs:
      run_type:
        description: 'Which engine to run manually?'
        required: true
        default: 'master'
        type: choice
        options:
          - master
          - news
          - matrix
          - screen
          - watchlist
          - diagnose
          - redis-check
      symbol:
        description: 'Ticker for run_type = diagnose: prints provider data AND why the screen gave that result (NO DATA / pre-revenue / etc.)'
        required: false
        default: 'LLY'
        type: string

permissions:
  contents: write

concurrency:
  group: portfolio-pipeline
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  eod-master:
    name: EOD Master + Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 22 * * 1-5') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_type == 'master')

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      # 1. Earnings numbers first: the daily engine below consumes them.
      - name: Run Earnings Event Analyser
        id: earnings
        continue-on-error: true
        working-directory: backend
        env:
          REDIS_URL:            ${{ secrets.REDIS_URL }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FINNHUB_API_KEY:      ${{ secrets.FINNHUB_API_KEY }}
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          POLYGON_API_KEY:      ${{ secrets.POLYGON_API_KEY }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: npm run earnings-event

      # 2. Core daily engine (no continue-on-error: if this fails the pipeline stops).
      - name: Run master update
        id: master
        working-directory: backend
        env:
          REDIS_URL:            ${{ secrets.REDIS_URL }}
          FINNHUB_API_KEY:      ${{ secrets.FINNHUB_API_KEY }}
          NEWSDATA_API_KEY:     ${{ secrets.NEWSDATA_API_KEY }}
          FMP_API_KEY:          ${{ secrets.FMP_API_KEY }}
          POLYGON_API_KEY:      ${{ secrets.POLYGON_API_KEY }}
          SEC_API_KEY:          ${{ secrets.SEC_API_KEY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: npm run update

      - name: Run correlation matrix
        id: matrix
        continue-on-error: true
        working-directory: backend
        env:
          REDIS_URL:            ${{ secrets.REDIS_URL }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: npm run generate-correlation

      - name: Run Filing Narrative Analyser
        id: filing
        continue-on-error: true
        working-directory: backend
        env:
          REDIS_URL:            ${{ secrets.REDIS_URL }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          POLYGON_API_KEY:      ${{ secrets.POLYGON_API_KEY }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: npm run filing-narrative

      # Periodic multibagger thesis check: reads today's quality score and analyses. Only holdings that are due
      # (15 days, or a trigger) plus pending/stale watchlist stocks are re-checked.
      - name: Run Compounder Thesis Check
        id: multibagger
        continue-on-error: true
        working-directory: backend
        env:
          REDIS_URL:             ${{ secrets.REDIS_URL }}
          FINNHUB_API_KEY:       ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY:           ${{ secrets.FMP_API_KEY }}
          POLYGON_API_KEY:       ${{ secrets.POLYGON_API_KEY }}
          SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}
          WATCHLIST_MAX_PER_RUN: '60'
          MB_REFRESH_DAYS:       '15'
        run: npm run multibagger

      - name: Configure git
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Commit score history CSV
        if: always()
        run: |
          git add backend/data/score_history.csv || true
          git commit -m "📊 EOD $(date -u +%Y-%m-%d)" || true
          git pull --rebase origin main || true
          git push || true

      # 6. Pipeline report: nothing fails silently any more.
      - name: Pipeline report
        if: always()
        env:
          R_EARNINGS:   ${{ steps.earnings.outcome }}
          R_MASTER:     ${{ steps.master.outcome }}
          R_MATRIX:     ${{ steps.matrix.outcome }}
          R_FILING:     ${{ steps.filing.outcome }}
          R_MULTIBAGGER: ${{ steps.multibagger.outcome }}
        run: |
          bad=0
          {
            echo "## EOD pipeline report"
            echo ""
            echo "| Step | Outcome |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for pair in "Earnings event:$R_EARNINGS" "Daily quality engine:$R_MASTER" "Correlation matrix:$R_MATRIX" "Filing narrative:$R_FILING" "Compounder thesis check:$R_MULTIBAGGER"; do
            name="${pair%%:*}"; out="${pair##*:}"
            case "$out" in
              success) icon="✅" ;;
              skipped) icon="⏭️" ;;
              *) icon="❌"; bad=1; echo "::error::$name finished with outcome '$out'. Its data is stale until the next successful run." ;;
            esac
            echo "| $name | $icon $out |" >> "$GITHUB_STEP_SUMMARY"
          done
          if [ "$bad" = "1" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "One or more steps failed. The other steps still ran, but treat the failed step's data as stale." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  intraday-news:
    name: Intraday News Update
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'schedule' && (
        github.event.schedule == '30 13 * * 1-5' ||
        github.event.schedule == '0 17 * * 1-5'  ||
        github.event.schedule == '45 20 * * 1-5'
      )) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_type == 'news')

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install backend dependencies
        working-directory: backend
        run: npm install
      - name: Run intraday news update
        working-directory: backend
        env:
          REDIS_URL:            ${{ secrets.REDIS_URL }}
          NEWSDATA_API_KEY:     ${{ secrets.NEWSDATA_API_KEY }}
          FINNHUB_API_KEY:      ${{ secrets.FINNHUB_API_KEY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: npm run update:news

  correlation-matrix:
    name: Correlation Matrix Only
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' && github.event.inputs.run_type == 'matrix'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install backend dependencies
        working-directory: backend
        run: npm install
      - name: Run correlation matrix
        working-directory: backend
        env:
          REDIS_URL:            ${{ secrets.REDIS_URL }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: npm run generate-correlation

  multibagger-screen:
    name: Compounder Screen (manual)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.run_type == 'screen' || github.event.inputs.run_type == 'watchlist')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install backend dependencies
        working-directory: backend
        run: npm install
      - name: Run compounder screen
        working-directory: backend
        env:
          REDIS_URL:             ${{ secrets.REDIS_URL }}
          FINNHUB_API_KEY:       ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY:           ${{ secrets.FMP_API_KEY }}
          POLYGON_API_KEY:       ${{ secrets.POLYGON_API_KEY }}
          SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}
          WATCHLIST_MAX_PER_RUN: '60'
          MB_REFRESH_DAYS:       '15'
          FORCE_RUN: ${{ github.event.inputs.run_type == 'screen' && 'true' || 'false' }}
        run: npm run multibagger -- ${{ github.event.inputs.run_type == 'watchlist' && '--watchlist-only' || '' }}

  diagnose-data:
    name: Data Diagnostic (manual)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event_name == 'workflow_dispatch' && github.event.inputs.run_type == 'diagnose'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install backend dependencies
        working-directory: backend
        run: npm install
      - name: Provider data + why the screen answered what it did
        working-directory: backend
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY:     ${{ secrets.FMP_API_KEY }}
          SYMBOL:          ${{ github.event.inputs.symbol }}
        run: |
          if ! [[ "$SYMBOL" =~ ^[A-Za-z][A-Za-z0-9.-]{0,9}$ ]]; then echo "Not a valid ticker: $SYMBOL"; exit 1; fi
          npm run multibagger -- "--estimates=$SYMBOL"

  redis-check:
    name: Redis check + keepalive + backup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 12 * * 0') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_type == 'redis-check')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install backend dependencies
        working-directory: backend
        run: npm install
      - name: Redis check (counts only) + keepalive write + backup to Supabase
        working-directory: backend
        env:
          REDIS_URL:            ${{ secrets.REDIS_URL }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/redis-check.js --backup
